# Optional external configuration: copy to ./config/application.yml next to the jar.
# MySQL defaults and the demo profile are already bundled in the application.
server:
  port: ${PORT:8080}
  servlet:
    context-path: /AncientCharmOfFujianStyle
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ancient_charm?serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USER:ancient_charm}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
upload:
  path: ${UPLOAD_PATH:./uploads}
  access-path: images/
security:
  session-ttl-seconds: ${SESSION_TTL_SECONDS:86400}
ai:
  api-url: ${AI_API_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:glm-4-flash}
