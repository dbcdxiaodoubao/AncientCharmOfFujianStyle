# 复制为 application.yml 后，按本机环境填写数据库与上传目录。
server:
  port: 8080
  servlet:
    context-path: /AncientCharmOfFujianStyle

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://<host>:<port>/<database>?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: <database-username>
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

upload:
  path: <local-upload-directory>
  access-path: images/

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ancientcharmoffujianstyle.domain.entity
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

knife4j:
  enable: true
  openapi:
    title: 古韵闽风API
    description: 福建非遗文旅智能助手接口文档
    version: 1.0

security:
  ignore-urls:
    - /login
    - /register
    - /map
    - /doc.html
    - /webjars/**
    - /swagger-resources/**
    - /v3/api-docs/**
    - /static/**
    - /error
    - /images/**
  builtin-admin:
    username: <builtin-admin-username>
    password-hash: <bcrypt-password-hash>
