# Secrets come from the environment. Use --spring.profiles.active=demo for zero-DB reproduction.
server.port=${PORT:8080}
server.servlet.context-path=/AncientCharmOfFujianStyle
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ancient_charm?serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${DB_USER:ancient_charm}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
upload.path=${UPLOAD_PATH:./uploads}
upload.access-path=images/
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.ancientcharmoffujianstyle.domain.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
security.session-ttl-seconds=${SESSION_TTL_SECONDS:86400}
ai.api-url=${AI_API_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:glm-4-flash}
