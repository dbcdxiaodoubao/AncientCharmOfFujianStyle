# Volatile, synthetic data; no external database or shared account required.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:ancient_charm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.data-locations=classpath:demo-data.sql
pagehelper.helper-dialect=h2
